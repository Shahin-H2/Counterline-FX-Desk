<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Counterline FX Desk app icon. Copyright (c) 2026 Shahin Hassanyan. All rights reserved.

    The four tiles of the brand mark on the app's night sky.
    Drawn on Apple's icon grid, an 824 px rounded square centred on a 1024 px canvas.
    icon-mac.png is this file as it is; icon.png is the same drawing cropped to the square
    (viewBox "84 84 856 856") for Windows, where icons run to the edge of the canvas.
  -->
  <defs>
    <linearGradient id="sky" x1="0.22" y1="0" x2="0.78" y2="1">
      <stop offset="0" stop-color="#1c4d46" />
      <stop offset="0.5" stop-color="#0f2c31" />
      <stop offset="1" stop-color="#161f4c" />
    </linearGradient>
    <radialGradient id="aurora" cx="0.82" cy="0.06" r="0.78">
      <stop offset="0" stop-color="#48d6ae" stop-opacity="0.6" />
      <stop offset="0.55" stop-color="#2f9e86" stop-opacity="0.16" />
      <stop offset="1" stop-color="#2f9e86" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dusk" cx="0.14" cy="0.98" r="0.72">
      <stop offset="0" stop-color="#8672f5" stop-opacity="0.55" />
      <stop offset="0.6" stop-color="#6a5ae0" stop-opacity="0.12" />
      <stop offset="1" stop-color="#6a5ae0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d9f08e" stop-opacity="0.34" />
      <stop offset="0.6" stop-color="#d9f08e" stop-opacity="0.08" />
      <stop offset="1" stop-color="#d9f08e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f8ae" />
      <stop offset="1" stop-color="#cbe773" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <clipPath id="square">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#04100e" flood-opacity="0.34" />
    </filter>
    <filter id="tile-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#04100e" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)" filter="url(#lift)" />

  <g clip-path="url(#square)">
    <rect x="100" y="100" width="824" height="824" fill="url(#aurora)" />
    <rect x="100" y="100" width="824" height="824" fill="url(#dusk)" />

    <g fill="#ffffff">
      <circle cx="826" cy="262" r="26" fill="url(#halo)" />
      <circle cx="170" cy="646" r="22" fill="url(#halo)" />
      <circle cx="190" cy="205" r="3.4" opacity="0.8" />
      <circle cx="270" cy="158" r="2.3" opacity="0.55" />
      <circle cx="352" cy="232" r="1.9" opacity="0.5" />
      <circle cx="566" cy="166" r="1.8" opacity="0.45" />
      <circle cx="690" cy="226" r="1.9" opacity="0.5" />
      <circle cx="748" cy="170" r="2.7" opacity="0.7" />
      <circle cx="826" cy="262" r="3.8" opacity="0.92" />
      <circle cx="866" cy="468" r="2.3" opacity="0.5" />
      <circle cx="824" cy="646" r="1.9" opacity="0.45" />
      <circle cx="868" cy="764" r="3.1" opacity="0.7" />
      <circle cx="716" cy="846" r="2.1" opacity="0.5" />
      <circle cx="458" cy="868" r="2.7" opacity="0.6" />
      <circle cx="254" cy="820" r="1.9" opacity="0.45" />
      <circle cx="170" cy="646" r="3.2" opacity="0.85" />
      <circle cx="184" cy="418" r="1.9" opacity="0.45" />
    </g>

    <g transform="translate(512 512) rotate(-8)">
      <circle r="372" fill="url(#glow)" />
      <g fill="url(#lime)" filter="url(#tile-shadow)">
        <rect x="-221" y="-221" width="190" height="190" rx="46" />
        <rect x="31" y="-221" width="190" height="190" rx="46" opacity="0.72" />
        <rect x="-221" y="31" width="190" height="190" rx="46" opacity="0.52" />
        <rect x="31" y="31" width="190" height="190" rx="46" opacity="0.88" />
      </g>
    </g>
  </g>

  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4" />
</svg>
