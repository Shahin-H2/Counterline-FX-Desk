# How `npm run dist` packages the desktop app. Options: https://www.electron.build/configuration
appId: com.shahinhassanyan.counterline-fx-desk
productName: Counterline FX Desk
copyright: Copyright © 2026 Shahin Hassanyan. All rights reserved.
directories:
  output: dist
# The app does not update itself, so no update feed is written into it or beside the installers.
publish: null

# Only what the app runs on, and its license, goes into an installer. Everything else in this
# folder stays out of it, including .env and the tests.
files:
  - package.json
  - LICENSE
  - server.mjs
  - index.html
  - display.html
  - styles.css
  - src/**
  - desktop/**

mac:
  category: public.app-category.finance
  icon: build/icon-mac.png
  # Ad-hoc signature until a Developer ID certificate is configured; macOS reports an unsigned
  # download as damaged. Remove this line to sign with the certificate instead.
  identity: "-"
  artifactName: Counterline-FX-Desk-${version}-mac.${ext}
  target:
    # One download for both Apple silicon and Intel Macs.
    - target: dmg
      arch: universal

win:
  icon: build/icon.png
  artifactName: Counterline-FX-Desk-${version}-windows-setup.${ext}
  target:
    - target: nsis
      arch: x64
